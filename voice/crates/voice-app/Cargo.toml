[package]
name = "voice-app"
description = "Rukoo Voice's tray app: the pill, its stop window, Settings and the tray over voice-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "rukoo-voice"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.5", features = ["tray-icon", "custom-protocol"] }
voice-core = { path = "../voice-core" }
voice-engine = { path = "../voice-engine" }
voice-protocol = { path = "../voice-protocol" }

[target.'cfg(windows)'.dependencies]
# The same versions tauri 2.12.5, wry and tao use, so HWNDs and WebView2 interfaces are one type.
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
