[package]
name = "voice-recorder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "rukoo-voice-recorder"
path = "src/main.rs"

# The recorder captures and writes to disk, nothing else, so it stays small and crash-isolated:
# no async runtime, no SQLite, no network beyond its own control port on 127.0.0.1.
[dependencies]
voice-audio = { path = "../voice-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Device capture is Windows-only in 0.1; elsewhere only the synthetic and file test sources run.
[target.'cfg(windows)'.dependencies]
cpal = "=0.18.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
hound = "=3.5.1"
