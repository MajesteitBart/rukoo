[package]
name = "voice-screen-files"
description = "The screen folder of a Rukoo Voice meeting: journal, clock mapping, frame and drop rules, the MP4 box walker and fragmented MP4 writer, clips and the screen process's control port"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Platform-neutral, so the app, the pipeline and bucket sync can read the screen folder and its
# tests run on Linux CI too. The Windows capture and encoding live in voice-screen.
[dependencies]
base64 = "0.22"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `flock`, which keeps a second screen process off the journal.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Timeline lines written by the recorder's own writer, for the follower and clock tests.
voice-recorder = { path = "../voice-recorder" }
# To check that the frame text and clip limits equal the protocol's.
voice-protocol = { path = "../voice-protocol" }
