[package]
name = "voice-screen"
description = "Rukoo Voice's screen recorder: frames with the text on screen and hardware-encoded video, in its own process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "rukoo-voice-screen"
path = "src/main.rs"

# Like the recorder, the screen process writes only its own folder: no async runtime, no SQLite,
# no network beyond its control port on 127.0.0.1. Media Foundation is loaded at run time
# (src/video/mf.rs), never linked, so a Windows N edition still records frames.
[dependencies]
voice-screen-files = { path = "../voice-screen-files" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The objc2 crates follow Tauri's and Rukoo's macOS dependencies (objc2 0.6.5, the framework
# crates at 0.3.2), so the process shares one objc2 with the app's WebView stack.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-core-foundation = "=0.3.2"
objc2-core-graphics = "=0.3.2"
objc2-core-text = "=0.3.2"
objc2-core-media = "=0.3.2"
objc2-core-video = "=0.3.2"
objc2-video-toolbox = "=0.3.2"
objc2-vision = "=0.3.2"
objc2-image-io = "=0.3.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Foundation",
  "Foundation_Collections",
  "Foundation_Metadata",
  "Globalization",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_System_WindowsProgramming",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
voice-recorder = { path = "../voice-recorder" }

# The crash and clock tests run the real recorder and the screen process from their own test
# binary (VOICE_SCREEN_TEST_ROLE), so they need their own main.
[[test]]
name = "crash"
harness = false

[[test]]
name = "clock"
harness = false
