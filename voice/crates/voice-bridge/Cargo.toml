[package]
name = "voice-bridge"
description = "Event log, discovery file and WebSocket server of the bridge between Rukoo Voice and Rukoo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
voice-protocol = { path = "../voice-protocol" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde_json = "1"
subtle = "2.6"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[dev-dependencies]
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
