[package]
name = "voice-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
voice-audio = { path = "../voice-audio" }
voice-bridge = { path = "../voice-bridge" }
voice-core = { path = "../voice-core" }
voice-input = { path = "../voice-input" }
voice-meetings = { path = "../voice-meetings" }
voice-protocol = { path = "../voice-protocol" }
voice-recorder = { path = "../voice-recorder" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Microphone capture, the chime, autostart and the disk check are Windows-only in 0.1, as in the
# recorder; elsewhere they report that the platform isn't supported.
[target.'cfg(windows)'.dependencies]
cpal = "=0.18.2"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Media_Audio",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
] }

# The controller tests run the recorder from this test binary (it calls the same
# `voice_recorder::run` as `rukoo-voice-recorder`), so the test needs its own main.
[[test]]
name = "controller"
harness = false

# The same, for meetings through the whole engine: the pill, dictation during a meeting, retention.
[[test]]
name = "meetings"
harness = false
