[package]
name = "voice-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]

# `flock`, which keeps a second writer off a live segment.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# An independent WAV reader, to prove the segments open outside our own code.
hound = "=3.5.1"
