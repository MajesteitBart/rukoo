<!doctype html>
<html lang="en">
<head>

  <script type="module" src="/app.js"></script>
  <style>
    .lost {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 40px var(--gutter);
      background:
        radial-gradient(40% 40% at 40% 35%, rgba(22, 240, 163, 0.07), transparent 70%),
        radial-gradient(40% 40% at 62% 40%, rgba(189, 45, 196, 0.08), transparent 70%);
    }
    .lost > div { display: grid; justify-items: center; gap: 24px; }
    .lost .pigeon { width: 150px; }
    .lost h1 { font-size: clamp(36px, 5vw, 56px); line-height: 1.05; }
    .lost .caption { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
