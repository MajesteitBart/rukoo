<!doctype html>
<html><head><meta charset="utf-8">
<style>

html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #08090a; font-family: Inter, sans-serif; font-optical-sizing: auto; -webkit-font-smoothing: antialiased; }

h1 { margin: 92px 0 0; font-size: 84px; line-height: .98; letter-spacing: -0.045em; font-weight: 640; color: #fff;
  background: linear-gradient(180deg, #fff 30%, rgba(247,248,248,.66)); -webkit-background-clip: text; color: transparent; }
p { margin: 26px 0 0; font-size: 26px; color: #a1a6af; letter-spacing: -0.01em; }

.peek { position: absolute; left: 1010px; top: 22px; width: 118px; transform: rotate(6deg); }
