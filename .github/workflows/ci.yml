name: Test and package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The Electron tests run one at a time (workers: 1), so Windows and Linux split them over three runners. Shard 1
        # has the slow agent tests; shard 2 also runs the unit tests and shard 3 builds the packages.
        include:
          - os: windows-latest
            arch: x64
            shard: 1
          - os: windows-latest
            arch: x64
            shard: 2
          - os: windows-latest
            arch: x64
            shard: 3
          - os: ubuntu-22.04
            arch: x64
            shard: 1
          - os: ubuntu-22.04
            arch: x64
            shard: 2
          - os: ubuntu-22.04
            arch: x64
            shard: 3
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
        if: runner.os == 'macOS' || matrix.shard == 2
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox dbus-x11 gnome-keyring libsecret-tools libgtk-3-0 libnss3 libasound2 libgbm1 libnotify4 libsecret-1-0
      # --fully-parallel splits by test rather than by file, so agent.spec.js and app.spec.js don't share a shard.
      # With one worker the tests still run one at a time.
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3 --fully-parallel
        if: runner.os == 'Windows'
      - name: Test Linux desktop interactions
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1200x24" dbus-run-session -- bash -euo pipefail -c '
            desktop_session_dir=$(mktemp -d)
            export XDG_DATA_HOME="$desktop_session_dir/data"
            export XDG_RUNTIME_DIR="$desktop_session_dir/runtime"
            export XDG_CURRENT_DESKTOP=GNOME
            mkdir -p "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"
            openbox >/tmp/rukoo-window-manager.log 2>&1 &
            window_manager_pid=$!
            cleanup() {
              kill "$window_manager_pid" 2>/dev/null || true
              rm -rf "$desktop_session_dir"
            }
            trap cleanup EXIT
            # An isolated, unlocked Secret Service lets Electron encrypt test credentials.
            # This password protects only the disposable CI keyring, never a user keyring.
            printf %s rukoo-ci-keyring | gnome-keyring-daemon --unlock --daemonize --components=secrets >/dev/null
            # The daemon takes its name on the session bus a moment after it returns. Asking the Secret Service
            # before that makes D-Bus start a second, locked daemon, which prompts and never answers.
            for attempt in $(seq 1 50); do
              if dbus-send --session --print-reply --dest=org.freedesktop.DBus /org/freedesktop/DBus \
                org.freedesktop.DBus.NameHasOwner string:org.freedesktop.secrets 2>/dev/null | grep -q "boolean true"; then
                break
              fi
              sleep 0.2
            done
            printf %s ready | timeout 15s secret-tool store --label="Rukoo CI readiness" application rukoo-ci
            test "$(timeout 15s secret-tool lookup application rukoo-ci)" = ready
            secret-tool clear application rukoo-ci
            sleep 1
            npm run test:e2e -- --shard=${{ matrix.shard }}/3 --fully-parallel
          '
      - name: Test native macOS desktop interactions
        if: runner.os == 'macOS'
        run: npx playwright test test/e2e/macos.spec.js
      - name: Build Windows or Linux packages
        if: runner.os != 'macOS' && matrix.shard == 3
        run: npm run dist -- --${{ matrix.arch }} --publish never
      - name: Build ad-hoc signed macOS test packages
        if: runner.os == 'macOS'
        run: npm run dist -- --${{ matrix.arch }} --publish never --config.mac.identity=- --config.mac.notarize=false
      # macOS shows this text when it asks whether Rukoo may use the local network. Without it, the question uses
      # Apple's generic text about discovering devices (#89). The English text is in Info.plist, from
      # build.mac.extendInfo; the Dutch one is build/mac/nl.lproj/InfoPlist.strings, copied by build.mac.extraResources.
      - name: Check the local network description in the macOS app
        if: runner.os == 'macOS'
        run: |
          plists=(dist/mac*/"Rukoo Mail.app"/Contents/Info.plist)
          if [ ! -f "${plists[0]}" ]; then
            echo "::error::No Rukoo Mail.app in dist/"
            exit 1
          fi
          for plist in "${plists[@]}"; do
            for file in "$plist" "$(dirname "$plist")/Resources/nl.lproj/InfoPlist.strings"; do
              if ! text=$(plutil -extract NSLocalNetworkUsageDescription raw -o - "$file") || [ -z "$text" ]; then
                echo "::error file=package.json::$file has no NSLocalNetworkUsageDescription"
                exit 1
              fi
              echo "$file: $text"
            done
          done
      - name: Test packaged macOS desktop interactions
        if: runner.os == 'macOS'
        env:
          SEM_MAC_PACKAGED: '1'
        run: npx playwright test test/e2e/macos.spec.js
      - uses: actions/upload-artifact@v7
        if: always() && runner.os == 'macOS'
        with:
          name: macos-evidence-${{ matrix.arch }}
          path: tmp/macos-evidence/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ matrix.os }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The Rukoo account server in server/: its tests run against the real Worker in workerd, and the bundle must build.
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/rukoo-account"

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # v6 moves Gradle caching into a proprietary component under Gradle's Terms of Use. v5 already runs on Node 24.
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew testDebugUnitTest assembleDebug --console=plain
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-results
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
