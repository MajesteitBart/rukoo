name: Website

# Tests the website on every change to it. A change that reaches main also deploys it to rukoo.io, once the tests
# pass. Run the workflow by hand on main to deploy without a change, for example after a server deploy.
on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  # A newer push to main replaces an older run, so the newest site wins. Each deploy still runs to its end,
  # because the deploy job has its own concurrency group below.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    env:
      # The image and screenshot tools use Playwright; the tests don't need a browser.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # The environment holds the Cloudflare token and only lets main use it.
    environment:
      name: rukoo.io
      url: https://rukoo.io
    concurrency:
      group: website-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # No npm ci: deploying needs only Wrangler, so no other package runs next to the token.
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
