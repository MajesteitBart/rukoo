name: Release Rukoo Voice for macOS

# Builds Rukoo Voice's macOS DMG and zip for a voice-v<version> tag with voice/scripts/package-macos.mjs, and attaches
# them to the draft release that "Release Rukoo Voice" (voice-release.yml) made for that tag. The Windows workflow
# makes the draft; this one only adds the Mac files, so the two never race for it and a Mac failure leaves the
# Windows release as it was. Wait for these files before publishing the draft.
#
# It starts when a "Release Rukoo Voice" run succeeds, or by hand with an existing tag. A run started by a tag push
# names the tag as its head branch; a dispatched Windows run names it in its artifact, rukoo-voice-<tag>. Without a
# voice-v tag it stops. workflow_run only fires for workflows on the default branch, so try it on a fork's main with a
# manual dispatch first.
#
# The macOS package is ad-hoc signed with hardened runtime and not notarized, as Rukoo Mail's Mac packages are, so the
# first launch needs Open Anyway in Privacy & Security. A release is never marked Latest: the README's download link
# points to the latest release, and that has to stay Rukoo.

on:
  workflow_run:
    workflows: ['Release Rukoo Voice']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Voice tag with a draft release, for example voice-v0.1.0 or voice-v0.2.0-rc.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: voice-release-macos-${{ inputs.tag || github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: false

jobs:
  # The package script makes and checks the app, the DMG with hdiutil (not Tauri's Finder-driven DMG step) and the zip.
  #
  # The NeMo runtime comes from voice/nemo-runtime/manifest-macos.json's pinned archive once it names one:
  # package-macos.mjs downloads it, checks the archive and every file's hash, and ships it, so the app's runtime matches
  # the pins voice-core checks. A tag whose manifest names none builds the runtime from source on that commit, which is
  # how a release works before the runtime is published. Such a build's dylib hashes are not the manifest's, because a
  # build's path and signature end up in its bytes, and an unpublished manifest pins no files at all: Voice in that
  # package reports speaker labels unavailable. The source build is not a way to publish a runtime; pack-macos.mjs does
  # that (voice/nemo-runtime/README.md).
  release-macos:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      CARGO_TERM_COLOR: always
      NEMO_OUT: voice/target/nemo/nemo_speech
    defaults:
      run:
        shell: bash
    steps:
      - name: Find the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DISPATCHED_TAG: ${{ inputs.tag }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_HEAD: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          tag=""
          if [[ -n "$DISPATCHED_TAG" ]]; then
            tag="$DISPATCHED_TAG"
          elif [[ "$RUN_EVENT" == "push" ]]; then
            tag="$RUN_HEAD"
          elif [[ -n "$RUN_ID" ]]; then
            # A dispatched Windows run: its artifact is rukoo-voice-<tag>.
            tag=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[].name' | sed -n 's/^rukoo-voice-\(voice-v.*\)$/\1/p' | head -n 1)
          fi
          if [[ ! "$tag" =~ ^voice-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::No voice-v tag for this run (found '${tag}'). Use voice-vMAJOR.MINOR.PATCH, optionally followed by -alpha.N, -beta.N or -rc.N."
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "tag: $tag"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      # package-macos.mjs runs Tauri's CLI through npx and reads the version with node.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check the version and the release commit
        run: |
          version=$(node -e '
            const fs = require("node:fs");
            const text = fs.readFileSync("voice/Cargo.toml", "utf8");
            const section = text.split(/^\[/m).find((part) => part.startsWith("workspace.package]"));
            const match = section && /^version\s*=\s*"([^"]+)"/m.exec(section);
            if (!match) { console.error("voice/Cargo.toml has no workspace version"); process.exit(1); }
            process.stdout.write(match[1]);
          ')
          tagged="${RELEASE_TAG#voice-v}"
          if [[ "$version" != "$tagged" ]]; then
            echo "::error::The tag is $RELEASE_TAG, but voice/Cargo.toml has version $version."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Voice release tags must point to a commit merged into main."
            exit 1
          fi

      - run: rustup show active-toolchain

      - name: Look for a published macOS runtime
        id: nemo
        run: |
          published=$(node -e 'const m = require(process.argv[1]); process.stdout.write(String(Boolean(m.archive)))' "$GITHUB_WORKSPACE/voice/nemo-runtime/manifest-macos.json")
          echo "published=$published" >> "$GITHUB_OUTPUT"
          if [[ "$published" == true ]]; then
            echo "voice/nemo-runtime/manifest-macos.json names an archive; package-macos.mjs downloads and checks it."
          else
            echo "voice/nemo-runtime/manifest-macos.json names no archive; this tag builds the runtime from source."
            echo "That build's hashes are not the manifest's, so this package reports speaker labels unavailable."
          fi

      # Only for a tag whose manifest pins no archive, so a release works before the runtime is published. This build
      # is for the package alone: it cannot become the published runtime, whose hashes the manifest pins (pack-macos.mjs
      # and voice/nemo-runtime/README.md do that).
      - name: Build the NeMo runtime from source
        if: steps.nemo.outputs.published != 'true'
        run: |
          if [[ ! -f voice/nemo-runtime/build-macos.sh ]]; then
            echo "::error::voice/nemo-runtime/build-macos.sh is missing on $RELEASE_TAG, so this tag can neither fetch nor build the arm64 NeMo runtime. A macOS package ships speaker labels; publish the runtime or add the script first."
            exit 1
          fi
          bash voice/nemo-runtime/build-macos.sh --out "$NEMO_OUT"
          if [[ ! -f "$NEMO_OUT/runtime.json" ]]; then
            echo "::error::voice/nemo-runtime/build-macos.sh wrote no runtime.json to $NEMO_OUT."
            exit 1
          fi

      # Builds the five release programs and Rukoo Voice.app, adds the runtime as Contents/Resources/nemo_speech,
      # signs inside out ad-hoc with hardened runtime, checks the Info.plist keys, entitlements, imports and minimum
      # system version, and writes the DMG, the zip and SHA256SUMS.txt. With a published runtime it downloads and checks
      # the pinned archive; from source it ships the folder just built.
      - name: Build, sign and check the macOS package
        run: |
          if [[ "${{ steps.nemo.outputs.published }}" == "true" ]]; then
            node voice/scripts/package-macos.mjs
          else
            node voice/scripts/package-macos.mjs --nemo-dir "$NEMO_OUT"
          fi

      # The Windows release attaches its own SHA256SUMS.txt, so the Mac checksums get a platform name instead of
      # replacing them.
      - name: Name the checksums for this platform
        run: cp voice/target/package/SHA256SUMS.txt voice/target/package/SHA256SUMS-macos-arm64.txt

      - uses: actions/upload-artifact@v7
        with:
          name: rukoo-voice-macos-${{ env.RELEASE_TAG }}
          path: |
            voice/target/package/Rukoo-Voice-*-arm64.dmg
            voice/target/package/Rukoo-Voice-*-arm64.zip
            voice/target/package/SHA256SUMS-macos-arm64.txt
          if-no-files-found: error
          retention-days: 14

      # Only uploads: the Windows workflow made the draft. Checked again right before the upload, because the draft may
      # have been published while this job built.
      - name: Attach the files to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#voice-v}"
          files=(
            "voice/target/package/Rukoo-Voice-$version-arm64.dmg"
            "voice/target/package/Rukoo-Voice-$version-arm64.zip"
            "voice/target/package/SHA256SUMS-macos-arm64.txt"
          )
          draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null) || draft=""
          if [[ -z "$draft" ]]; then
            echo "::error::There is no release for $RELEASE_TAG. \"Release Rukoo Voice\" makes the draft; run it first."
            exit 1
          elif [[ "$draft" != "true" ]]; then
            # Replacing the files of a published release would change what people already downloaded.
            echo "::error::$RELEASE_TAG is already published. Make a new Voice version instead."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          {
            echo "macOS package: ad-hoc signed, not notarized."
            echo ""
            echo "Draft release $RELEASE_TAG has Rukoo-Voice-$version-arm64.dmg, Rukoo-Voice-$version-arm64.zip and SHA256SUMS-macos-arm64.txt."
            echo ""
            echo "Publish it with \`gh release edit $RELEASE_TAG --draft=false --latest=false\`, or untick \"Set as the latest release\" when you publish it on GitHub, so Rukoo stays the latest release."
          } >> "$GITHUB_STEP_SUMMARY"
