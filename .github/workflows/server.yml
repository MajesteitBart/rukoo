name: Account server

# Deploys the account server in server/ to the server the Rukoo apps use, the bvdm environment in wrangler.jsonc, when
# a change to what it runs reaches main. The tests run again on that commit first, and a failing test stops the deploy.
# Pull requests never deploy: the server job in ci.yml tests them. Run the workflow by hand on main to deploy main
# again without a change. A merge that changes both this server and the website deploys both at once, in no set order,
# so a website change that needs a new server route merges after the server change that adds it.
on:
  push:
    branches: [main]
    paths:
      - 'server/src/**'
      # index.js and mcp.js read the version from package.json; the lockfile pins the Wrangler that deploys.
      - 'server/package.json'
      - 'server/package-lock.json'
      - 'server/wrangler.jsonc'
      - '.github/workflows/server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  # Deploys never cancel each other: one that started always finishes, and a newer run replaces one that is still
  # waiting, so the newest commit on main wins.
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      # The bundle and the bvdm settings the deploy below uses, without the token.
      - run: npx wrangler deploy --dry-run --env bvdm --outdir "$RUNNER_TEMP/rukoo-account"

  deploy:
    needs: test
    # A fork has no Cloudflare token for this server, and only main deploys.
    if: github.repository == 'MajesteitBart/rukoo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The environment holds the Cloudflare token, shared with website.yml, and only lets main use it.
    environment:
      name: rukoo.io
      url: https://meet.rukoo.io
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # The Wrangler in package-lock.json, the one the tests and the dry run used. Install scripts stay off and nothing
      # else is run, so Wrangler is the only package that runs next to the token.
      - run: npm ci --ignore-scripts
      - run: npx wrangler deploy --env bvdm
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Every app starts with GET /v1/info, on rukoo.io and on the Worker's old address. Both must answer it with the
      # server's features once the new code is live.
      - name: Check that the server answers
        run: |
          for url in https://rukoo.io/v1/info https://rukoo-account.bvdm.ai/v1/info; do
            ok=
            for attempt in 1 2 3 4 5 6; do
              if curl -fsS --max-time 15 -o "$RUNNER_TEMP/info.json" "$url" &&
                node -e 'const i = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (!Array.isArray(i.features)) process.exit(1); console.log(`features: ${i.features.join(", ")}; team chat: ${(i.workspace?.capabilities ?? []).join(", ") || "off"}`)' "$RUNNER_TEMP/info.json"; then
                ok=1
                break
              fi
              sleep 10
            done
            if [ -z "$ok" ]; then
              echo "::error::$url didn't answer GET /v1/info after the deploy"
              exit 1
            fi
            echo "$url answers"
          done
