name: Rukoo Voice

on:
  pull_request:
    paths:
      - 'voice/**'
      - 'src/main/voice/**'
      - 'test/voice-*'
      - '.github/workflows/voice.yml'
  push:
    branches: [main]
    paths:
      - 'voice/**'
      - 'src/main/voice/**'
      - 'test/voice-*'
      - '.github/workflows/voice.yml'

permissions:
  contents: read

concurrency:
  group: voice-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: voice
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The speaker label tests need the NeMo runtime, the Nemotron model and the AMI excerpt. They are fetched once
      # per pin and checked against their hashes; nothing of them is committed.
      - name: Cache the speaker label assets
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\speaker-assets
          key: speaker-assets-${{ hashFiles('voice/nemo-runtime/manifest.json', 'voice/fixtures/ami/manifest.json', 'voice/scripts/speaker-assets.ps1') }}
      # A failed download (a rate limit, say) doesn't fail the job: the tests whose assets are missing skip and say so.
      # The runtime is skipped until it is published (voice/nemo-runtime/README.md).
      - name: Fetch the speaker label assets
        id: speaker-assets
        continue-on-error: true
        shell: pwsh
        run: ./scripts/speaker-assets.ps1 -Out "$env:RUNNER_TEMP\speaker-assets"
      - name: Point the speaker label tests at the assets
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'speaker-assets'
          $found = [ordered]@{
            RUKOO_VOICE_TEST_NEMO_DIR = Join-Path $root 'nemo_speech'
            RUKOO_VOICE_TEST_NEMOTRON = Join-Path $root 'nemotron\Nemotron-3-Diarization.q8_0.gguf'
            RUKOO_VOICE_TEST_AMI = Join-Path $root 'ami'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $found.RUKOO_VOICE_TEST_NEMO_DIR 'runtime.json'))) { $found.Remove('RUKOO_VOICE_TEST_NEMO_DIR') }
          if (-not (Test-Path -LiteralPath $found.RUKOO_VOICE_TEST_NEMOTRON)) { $found.Remove('RUKOO_VOICE_TEST_NEMOTRON') }
          foreach ($name in 'json', 'rttm', 'wav') {
            if (-not (Test-Path -LiteralPath (Join-Path $found.RUKOO_VOICE_TEST_AMI "ami_en2002d_2132.$name"))) { $found.Remove('RUKOO_VOICE_TEST_AMI'); break }
          }
          foreach ($name in $found.Keys) {
            Write-Host "$name=$($found[$name])"
            "$name=$($found[$name])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          if ($found.Count -lt 3) { Write-Host 'Some speaker label assets are missing; the tests that need them skip.' }
      # Includes the two recorder tests voice/AGENTS.md requires: a hard kill and a lost microphone mid-meeting.
      - run: cargo test --workspace --no-fail-fast
      # Rukoo's real bridge client against Voice's real bridge server (the voice-bridge `serve` example, built above).
      # It needs Node's global WebSocket (Node 22 or later) and no npm packages.
      - name: Bridge interop between Rukoo and Voice
        working-directory: .
        env:
          RUKOO_VOICE_INTEROP: '1'
        run: node --test test/voice-interop.test.js

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: voice
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install ALSA headers for cpal
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # The app, the input crate and the local worker are Windows-first; the recorder, the bridge and the
      # transcript pipeline must behave the same on Linux, so their tests run here too.
      - run: cargo test --no-fail-fast -p voice-protocol -p voice-audio -p voice-recorder -p voice-core -p voice-bridge -p voice-meetings
