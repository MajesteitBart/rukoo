name: Voice NeMo runtime for macOS

# Builds the NeMo-Speech.cpp runtime that Rukoo Voice's macOS speaker worker loads, on Apple Silicon, checks it on the
# AMI excerpt before and after packing, and uploads the zip, manifest-macos.json and the notes as an artifact.
# Publishing the artifact as a release is a separate, manual step (voice/nemo-runtime/README.md). The Windows runtime
# builds in voice-nemo-runtime.yml, which leaves these files out of its paths. Like that workflow it runs when its own
# files change, on any branch but not on tags.

on:
  pull_request:
    paths:
      - 'voice/nemo-runtime/manifest-macos.json'
      - 'voice/nemo-runtime/build-macos.sh'
      - 'voice/nemo-runtime/macos.patch'
      - 'voice/nemo-runtime/pack-macos.mjs'
      - '.github/workflows/voice-nemo-runtime-macos.yml'
  push:
    # Branches only: a release tag would otherwise start a full runtime build.
    branches: ['**']
    paths:
      - 'voice/nemo-runtime/manifest-macos.json'
      - 'voice/nemo-runtime/build-macos.sh'
      - 'voice/nemo-runtime/macos.patch'
      - 'voice/nemo-runtime/pack-macos.mjs'
      - '.github/workflows/voice-nemo-runtime-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-nemo-runtime-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in step with voice/nemo-runtime/manifest-macos.json.
  RUNTIME_NAME: nemo-runtime-97a15af-1

jobs:
  build-macos:
    # Apple Silicon. The image and the checkout path are pinned: the assert strings in the built
    # dylibs embed their source path, so the same commit built in another folder has other bytes.
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # No second checkout of NeMo-Speech.cpp: the script clones the pinned commit and submodules
      # itself, so a local build and this job run the same commands.
      - name: Build the runtime
        run: |
          ./voice/nemo-runtime/build-macos.sh \
            --source "$RUNNER_TEMP/nemo/NeMo-Speech.cpp" \
            --out "$RUNNER_TEMP/nemo-runtime/nemo_speech" \
            --runner macos-15
      - name: Build the speaker worker
        working-directory: voice
        run: cargo build --release --locked -p voice-speakers
      - name: Cache the model and the AMI excerpt
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/speaker-assets
          key: speaker-assets-${{ hashFiles('voice/fixtures/ami/manifest.json', 'voice/scripts/speaker-assets.mjs') }}
      # The smoke test uses the folder this job just built, not the published runtime, so only the model
      # and the excerpt are fetched here.
      - name: Fetch the model and the AMI excerpt
        working-directory: voice
        run: node scripts/speaker-assets.mjs --out "$RUNNER_TEMP/speaker-assets" --model --ami
      # The worker loads the runtime in its own process, so a broken build ends that process with an
      # error code instead of this step's shell.
      - name: Smoke test on the AMI excerpt
        working-directory: voice
        run: |
          assets="$RUNNER_TEMP/speaker-assets"
          report="$RUNNER_TEMP/self-test.json"
          target/release/rukoo-voice-speakers --self-test \
            --runtime "$RUNNER_TEMP/nemo-runtime/nemo_speech" \
            --model "$assets/nemotron/Nemotron-3-Diarization.q8_0.gguf" \
            --wav "$assets/ami/ami_en2002d_2132.wav" \
            --report "$report"
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (report.speakers < 3) throw new Error(`The runtime heard ${report.speakers} speakers on the AMI excerpt instead of at least 3`);
            if (report.frames < 5900) throw new Error(`The runtime returned ${report.frames} frames for 60 s instead of about 6,000`);
            console.log("Self-test:", JSON.stringify(report));
          ' "$report"
      # pack-macos.mjs signs the six dylibs the way package-macos.mjs signs them, checks the folder against its
      # runtime.json, writes manifest-macos.json with the build filled in and zips the files. Publishing the result is the
      # maintainer's step, as on Windows.
      - name: Pack the runtime
        run: |
          node voice/nemo-runtime/pack-macos.mjs \
            --runtime "$RUNNER_TEMP/nemo-runtime/nemo_speech" \
            --out "$RUNNER_TEMP/nemo-release" \
            --repository "$GITHUB_REPOSITORY"
          cp "$RUNNER_TEMP/self-test.json" "$RUNNER_TEMP/nemo-release/"
          cat "$RUNNER_TEMP/nemo-release/manifest-macos.json"
      # The self-test above used the unsigned build. These are the bytes that get published: unpack the zip and load
      # the signed dylibs in the worker, so a signature that breaks loading fails here instead of in a release.
      - name: Smoke test the packed runtime
        working-directory: voice
        run: |
          assets="$RUNNER_TEMP/speaker-assets"
          runtime="$RUNNER_TEMP/nemo-packed/nemo_speech"
          rm -rf "$RUNNER_TEMP/nemo-packed"
          mkdir -p "$runtime"
          ditto -x -k "$RUNNER_TEMP/nemo-release/${{ env.RUNTIME_NAME }}-macos-arm64.zip" "$runtime"
          report="$RUNNER_TEMP/self-test-packed.json"
          target/release/rukoo-voice-speakers --self-test \
            --runtime "$runtime" \
            --model "$assets/nemotron/Nemotron-3-Diarization.q8_0.gguf" \
            --wav "$assets/ami/ami_en2002d_2132.wav" \
            --report "$report"
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (report.speakers < 3) throw new Error(`The packed runtime heard ${report.speakers} speakers on the AMI excerpt instead of at least 3`);
            if (report.frames < 5900) throw new Error(`The packed runtime returned ${report.frames} frames for 60 s instead of about 6,000`);
            console.log("Packed self-test:", JSON.stringify(report));
          ' "$report"
          cp "$report" "$RUNNER_TEMP/nemo-release/"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RUNTIME_NAME }}-macos-arm64
          path: ${{ runner.temp }}/nemo-release/
          retention-days: 30
          if-no-files-found: error
