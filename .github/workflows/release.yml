name: Release Windows and Linux packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (for example v1.0.0 or v1.1.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Validate tag format
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$') {
            throw 'Use vMAJOR.MINOR.PATCH, optionally followed by -alpha.N, -beta.N or -rc.N.'
          }

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged version and release commit
        shell: pwsh
        run: |
          @'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const version = process.env.RELEASE_TAG.slice(1);
          if ([pkg.version, lock.version, lock.packages[''].version].some(v => v !== version)) {
            throw new Error('The tag, package.json and package-lock.json versions must match.');
          }
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw 'Release version validation failed.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tags must point to a commit merged into main.' }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox dbus-x11 gnome-keyring libsecret-tools libgtk-3-0 libnss3 libasound2 libgbm1 libnotify4 libsecret-1-0

      - run: npm run test:e2e
        if: runner.os == 'Windows'
      - name: Test Linux desktop interactions
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1200x24" dbus-run-session -- bash -euo pipefail -c '
            desktop_session_dir=$(mktemp -d)
            export XDG_DATA_HOME="$desktop_session_dir/data"
            export XDG_RUNTIME_DIR="$desktop_session_dir/runtime"
            export XDG_CURRENT_DESKTOP=GNOME
            mkdir -p "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"
            openbox >/tmp/rukoo-window-manager.log 2>&1 &
            window_manager_pid=$!
            cleanup() {
              kill "$window_manager_pid" 2>/dev/null || true
              rm -rf "$desktop_session_dir"
            }
            trap cleanup EXIT
            # An isolated, unlocked Secret Service lets Electron encrypt test credentials.
            # This password protects only the disposable CI keyring, never a user keyring.
            printf %s rukoo-ci-keyring | gnome-keyring-daemon --unlock --daemonize --components=secrets >/dev/null
            printf %s ready | timeout 15s secret-tool store --label="Rukoo CI readiness" application rukoo-ci
            test "$(timeout 15s secret-tool lookup application rukoo-ci)" = ready
            secret-tool clear application rukoo-ci
            sleep 1
            npm run test:e2e
          '

      - name: Build platform packages
        run: npm run dist -- --x64 --publish never

      - name: Verify artifacts and write checksums
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $files = @("dist/Rukoo-Mail-Setup-$version.exe", "dist/Rukoo-Mail-Portable-$version.exe")
          if ($IsLinux) {
            $files = @("dist/Rukoo-Mail-$version-x86_64.AppImage", "dist/Rukoo-Mail-$version-amd64.deb")
          }
          $checksums = foreach ($file in $files) {
            if (!(Test-Path -LiteralPath $file) -or (Get-Item -LiteralPath $file).Length -eq 0) {
              throw "Missing or empty release package: $file"
            }
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          [System.IO.File]::WriteAllText("$pwd/dist/SHA256SUMS-${{ matrix.platform }}.txt", ($checksums -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-release
          path: |
            dist/Rukoo-Mail-Setup-*.exe
            dist/Rukoo-Mail-Portable-*.exe
            dist/Rukoo-Mail-*.AppImage
            dist/Rukoo-Mail-*.deb
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          merge-multiple: true
          path: release

      - name: Publish the draft release with packages and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          cat SHA256SUMS-windows.txt SHA256SUMS-linux.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          flags=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags=(--prerelease --latest=false)
          fi
          # The maintainer writes the title and notes in a draft release before the run.
          if ! found=$(gh release view "$RELEASE_TAG" --json isDraft,name --jq '"\(.isDraft)\t\(.name)"'); then
            echo "::error::There is no draft release for $RELEASE_TAG. Write one, then re-run the failed jobs."
            exit 1
          fi
          IFS=$'\t' read -r draft title <<< "$found"
          if [[ "$draft" != true ]]; then
            echo "::error::$RELEASE_TAG is already published."
            exit 1
          fi
          if [[ "$title" != "$RELEASE_TAG - "* ]]; then
            echo "::error::Title the draft \"$RELEASE_TAG - Added ...\" or \"$RELEASE_TAG - Fixed ...\", then re-run the failed jobs."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" ./*.exe ./*.AppImage ./*.deb SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --tag "$RELEASE_TAG" --verify-tag --draft=false "${flags[@]}"
